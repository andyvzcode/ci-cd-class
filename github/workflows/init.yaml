

build-python-app:
  name: Build Python App
  runs-on: ubuntu-latest
  matrix:
    python-version: ["3.14"]

  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
